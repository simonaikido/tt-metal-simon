name: "Cleanup Action"
description: "Cleans up the workspace to remove root-owned files on non-ephemeral runners."

inputs:
  path:
    description: "The directory to clean up"
    required: false
    default: "/__w/tt-metal/tt-metal/docker-job"
runs:
  using: "composite"
  steps:
    - name: Cleanup
      shell: bash
      env:
        PATH_TO_CLEAN: ${{ inputs.path }}
      run: |
        cd /
        echo "pre rm"
        ls -al "$PATH_TO_CLEAN"
        rm -rf "$PATH_TO_CLEAN"
        echo "post rm"
        ls -al "$(dirname "$PATH_TO_CLEAN")"
